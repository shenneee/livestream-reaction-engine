<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestream Reaction Engine</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>Livestream Reaction Engine</h1>
        <p class="subtitle">Welcome to the Livestream Reaction Engine! This application allows you to react to live streams in real-time.</p>
        
        <!--Main Livestream Stage-->
        <div class="stage" id="stage">

            <div class="stream-label">Live Stream</div>
            <div class="welcome-message">
                <h2>Welcome to the live stream!</h2>
                <p>Send a reaction to get started! ❤️</p>
            </div>

            <!-- Reactions will appear inside this area -->
        </div>

        <!-- Reaction Controls -->
        <div class="controls">

            <!-- Reaction Selection -->
            <div class="reaction-buttons">

                <button class="reaction-button" data-reaction="👍">👍</button>
                <button class="reaction-button" data-reaction="👎">👎</button>
                <button class="reaction-button" data-reaction="❤️">❤️</button>
                <button class="reaction-button" data-reaction="😂">😂</button>

            </div>

            <!-- Send Reaction -->
            <button id="send-button">Send Reaction</button>

            <!-- Animation Mode -->
            <div class="mode-controls">

                <label for="mode-select">Animation Mode:</label>

                <select id="mode-select">
                    <option value="css">Phase 1 - CSS</option>
                    <option value="gsap">Phase 2 - GSAP</option>
                </select>

            </div>

            <!-- GSAP Speed Control -->
            <div class="speed-control">

                <label for="speed-slider">
                    Animation Speed:
                    <span id="speed-value">1.0x</span>
                </label>

                <input
                    type="range"
                    id="speed-slider"
                    min="0.1"
                    max="2.0"
                    step="0.1"
                    value="1.0"
                >

            </div>

        </div>

    </div>

    <!-- GSAP Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>
</body>
</html>
